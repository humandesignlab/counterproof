[project]
name = "counterproof-synthetic"
version = "0.1.0"
description = "Synthetic-only document generator and ground-truth manifests for Counterproof."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.10.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterproof_synthetic"]
