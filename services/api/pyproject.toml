[project]
name = "counterproof-api"
version = "0.1.0"
description = "Thin FastAPI service for Counterproof: validates input, calls the engine, returns the report."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "counterproof-core",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterproof_api"]
