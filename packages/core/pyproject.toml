[project]
name = "counterproof-core"
version = "0.1.0"
description = "Counterproof verification engine: the independent effective-challenge pipeline."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.10.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterproof_core"]
